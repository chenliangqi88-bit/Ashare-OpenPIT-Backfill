name: Full Real Open-PIT Rescue Announcements 2012-2013

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-real-pipeline-rescue-ann-2009-2012.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: full-real-openpit-rescue-ann-2012-2013-v4
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  CFG: ${{ github.workspace }}/real_pipeline/configs/ashare-lake.toml

# 2009-2011 are verified complete in run 33256249899.
# Run 33291562266 verified 2012-03-01..2012-03-28 and uploaded an always()
# checkpoint after 2012-03-29..31 repeatedly stalled. Resume exactly at
# 2012-03-29 with one-day chunks and bounded subprocess timeouts. The helper
# may only split failed multi-day ranges; single-day failure remains a hard FAIL.
jobs:
  announcement-2012-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - name: Restore partial 2012 checkpoint through March 28
        uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2012-final
          path: real_pipeline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: chenliangqi88-bit/Ashare-OpenPIT-Backfill
          run-id: 33291562266
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Resume 2012 from March 29 in bounded daily chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --start-date 2012-03-29 --end-date 2012-12-31
          --chunk-days 1 --config "$CFG"
          --attempts 3 --sleep-seconds 20 --timeout-seconds 600
      - name: Upload verified 2012 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2012-final-v2
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  announcement-2013:
    needs: announcement-2012-resume
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2012-final-v2
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Announcement 2013 in bounded daily chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --year 2013 --chunk-days 1 --config "$CFG"
          --attempts 3 --sleep-seconds 20 --timeout-seconds 600
      - name: Upload 2013 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2013-complete
          path: real_pipeline/
          retention-days: 3
          compression-level: 1
