      - run: pip install -r requirements-full.txt
      - name: Apply upstream CNINFO pagination termination fix
        run: python scripts/apply_ashare_lake_cninfo_pagination_hotfix.py
      - uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2014-complete
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Announcement 2015 in bounded daily chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --year 2015 --chunk-days 1 --config "$CFG"
          --attempts 2 --sleep-seconds 30 --timeout-seconds 1200
      - name: Upload 2015 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2015-complete
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  announcement-2016:
    needs: announcement-2015
