        run: python scripts/apply_ashare_lake_cninfo_pagination_hotfix.py
      - uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2016-q2-complete
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
