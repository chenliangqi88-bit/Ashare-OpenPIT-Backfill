name: Full Real Open-PIT Rescue Announcements 2012-2013

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-real-pipeline-rescue-ann-2009-2012.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: full-real-openpit-rescue-ann-2012-2013-v3
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  CFG: ${{ github.workspace }}/real_pipeline/configs/ashare-lake.toml

# 2009-2011 are verified complete in run 33256249899.
# The 2012 job was cancelled while processing March after Jan/Feb succeeded,
# but its always() checkpoint was uploaded. Resume from that checkpoint and
# use smaller bounded chunks so one CNINFO stall cannot consume the whole job.
jobs:
  announcement-2012-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - name: Restore partial 2012 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2012-complete
          path: real_pipeline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: chenliangqi88-bit/Ashare-OpenPIT-Backfill
          run-id: 33256249899
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Resume 2012 March-December in bounded weekly chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --year 2012 --start-month 3 --end-month 12
          --chunk-days 7 --config "$CFG"
          --attempts 3 --sleep-seconds 20 --timeout-seconds 900
      - name: Upload verified 2012 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2012-final
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  announcement-2013:
    needs: announcement-2012-resume
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2012-final
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Announcement 2013 in bounded weekly chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --year 2013 --chunk-days 7 --config "$CFG"
          --attempts 3 --sleep-seconds 20 --timeout-seconds 900
      - name: Upload 2013 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2013-complete
          path: real_pipeline/
          retention-days: 3
          compression-level: 1
