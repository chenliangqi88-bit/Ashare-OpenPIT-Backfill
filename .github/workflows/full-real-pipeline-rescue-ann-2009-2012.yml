name: Full Real Open-PIT Rescue Announcements 2016 Segmented

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-real-pipeline-rescue-ann-2009-2012.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: full-real-openpit-rescue-ann-2016-segmented-v1
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  CFG: ${{ github.workspace }}/real_pipeline/configs/ashare-lake.toml

# 2008-2015 announcement PIT is verified complete. Continue ONLY from the
# verified 2015 checkpoint, split into independent quarterly jobs. This changes
# orchestration only; PIT semantics, V3.0.3-H1 model semantics, statistical
# thresholds, and gates are untouched. A partial checkpoint is never named PASS.

jobs:
  announcement-2016-q1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - name: Apply upstream CNINFO pagination termination fix
        run: python scripts/apply_ashare_lake_cninfo_pagination_hotfix.py
      - name: Restore verified 2015 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2015-verified-complete
          path: real_pipeline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: chenliangqi88-bit/Ashare-OpenPIT-Backfill
          run-id: 33406827693
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Announcement 2016 Q1 in bounded daily chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --start-date 2016-01-01 --end-date 2016-03-31
          --chunk-days 1 --config "$CFG"
          --attempts 2 --sleep-seconds 30 --timeout-seconds 1200
      - name: Upload verified Q1 checkpoint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2016-q1-complete
          path: real_pipeline/
          retention-days: 3
          compression-level: 1
      - name: Upload Q1 partial checkpoint on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2016-q1-partial
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  announcement-2016-q2:
    needs: announcement-2016-q1
    if: needs.announcement-2016-q1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - name: Apply upstream CNINFO pagination termination fix
        run: python scripts/apply_ashare_lake_cninfo_pagination_hotfix.py
      - uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2016-q1-complete
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Announcement 2016 Q2 in bounded daily chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --start-date 2016-04-01 --end-date 2016-06-30
          --chunk-days 1 --config "$CFG"
          --attempts 2 --sleep-seconds 30 --timeout-seconds 1200
      - name: Upload verified Q2 checkpoint
        if: success()
