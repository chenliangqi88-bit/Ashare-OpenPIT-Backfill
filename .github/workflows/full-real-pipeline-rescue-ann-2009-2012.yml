name: Full Real Open-PIT Rescue Announcements 2014-2017

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-real-pipeline-rescue-ann-2009-2012.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: full-real-openpit-rescue-ann-2014-2017-v1
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  CFG: ${{ github.workspace }}/real_pipeline/configs/ashare-lake.toml

# 2008-2013 announcement PIT is verified complete through rescue checkpoints.
# Continue year-by-year from run 33300663577 / rescue-ann-2013-complete.
# Keep the exact upstream CNINFO pagination termination hotfix and bounded daily
# chunking already validated in 2012-2013. This changes orchestration only and
# does not change PIT/model/H1/statistical gate semantics.

jobs:
  announcement-2014:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - name: Apply upstream CNINFO pagination termination fix
        run: python scripts/apply_ashare_lake_cninfo_pagination_hotfix.py
      - name: Restore verified 2013 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: rescue-ann-2013-complete
          path: real_pipeline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: chenliangqi88-bit/Ashare-OpenPIT-Backfill
          run-id: 33300663577
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Announcement 2014 in bounded daily chunks
        run: >-
          python scripts/backfill_announcement_monthly.py
          --year 2014 --chunk-days 1 --config "$CFG"
          --attempts 2 --sleep-seconds 30 --timeout-seconds 1200
      - name: Upload 2014 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-ann-2014-complete
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  announcement-2015:
    needs: announcement-2014
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
