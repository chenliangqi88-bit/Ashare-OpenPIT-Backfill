name: Full Real Open-PIT Pipeline Rescue Continue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-real-pipeline-rescue-continue.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: full-real-openpit-rescue-continue
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
  CFG: ${{ github.workspace }}/real_pipeline/configs/ashare-lake.toml

jobs:
  stage1-checkpoint-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - name: Restore 16.7M-row core checkpoint
        uses: actions/download-artifact@v4
        with:
          name: rescue-stage1-core-complete
          path: real_pipeline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: chenliangqi88-bit/Ashare-OpenPIT-Backfill
          run-id: 33161666228
      - name: Rebind config
        run: |
          set -euo pipefail
          python scripts/set_production_history_window.py --start 2008-01-01
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Finish non-daily critical market layers
        run: |
          set -euo pipefail
          asl backfill index_bars --start 2008-01-01 --end 2026-08-27 --config "$CFG"
          asl backfill corporate_actions --start 2008-01-01 --end 2026-08-27 --config "$CFG"
          asl derive adj_factors --config "$CFG"
      - name: Preserve daily-bars failure as audit evidence
        if: always()
        run: |
          mkdir -p real_pipeline/reports
          cat > real_pipeline/reports/daily_bars_ingest_warning.json <<'JSON'
          {
            "status": "INCOMPLETE_REQUIRES_H1_AUDIT",
            "source": "eastmoney",
            "successful_rows_from_checkpoint": 16677302,
            "reason": "One or more symbol batches failed after repeated EastMoney server disconnects in rescue run 33161666228.",
            "policy": "Do not promote to Production unless H1 coverage and lineage gates pass. Missing rows are not imputed and are not treated as PASS."
          }
          JSON
          asl status --datasets --config "$CFG" || true
      - name: Upload finalized Stage 1 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-cont-stage1-core
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  stage2a-disclosure-financial:
    needs: stage1-checkpoint-finalize
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - uses: actions/download-artifact@v4
        with:
          name: rescue-cont-stage1-core
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Financial PIT backfill
        run: asl backfill financial_statement_items --start 2008-01-01 --end 2026-08-27 --config "$CFG"
      - name: Announcement PIT backfill with bounded retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if asl backfill announcement_index --start 2008-01-01 --end 2026-08-27 --config "$CFG"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 60))
          done
      - name: Earnings schedule
        continue-on-error: true
        run: asl backfill earnings_disclosure_schedule --start 2008-01-01 --end 2026-08-27 --config "$CFG"
      - name: Upload Stage 2a checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-cont-stage2a-financial-disclosure
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  stage2b-market-macro:
    needs: stage2a-disclosure-financial
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - uses: actions/download-artifact@v4
        with:
          name: rescue-cont-stage2a-financial-disclosure
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Required valuation
        run: asl backfill valuation_metrics --start 2008-01-01 --end 2026-08-27 --config "$CFG"
      - name: Required macro
        run: asl backfill macro_indicators --start 2008-01-01 --end 2026-08-27 --config "$CFG"
      - name: Optional market/event datasets
        continue-on-error: true
        run: |
          asl backfill share_structure --start 2008-01-01 --end 2026-08-27 --config "$CFG" || true
          asl backfill margin_trading --start 2008-01-01 --end 2026-08-27 --config "$CFG" || true
          asl backfill northbound_flows --start 2008-01-01 --end 2026-08-27 --config "$CFG" || true
          asl backfill industry_members --start 2020-01-01 --end 2026-08-27 --config "$CFG" || true
          asl backfill share_unlock_schedule --start 2008-01-01 --end 2026-08-27 --config "$CFG" || true
          asl backfill regulatory_events --start 2008-01-01 --end 2026-08-27 --config "$CFG" || true
          asl backfill block_trades --start 2008-01-01 --end 2026-08-27 --config "$CFG" || true
          asl backfill institutional_holdings --start 2008-01-01 --end 2026-08-27 --config "$CFG" || true
          asl derive adj_factors --config "$CFG"
      - name: Upload Stage 2b checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-cont-stage2b-market-macro
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  stage2c-trading-status:
    needs: stage2b-market-macro
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - uses: actions/download-artifact@v4
        with:
          name: rescue-cont-stage2b-market-macro
          path: real_pipeline
      - name: Rebind config
        run: |
          cd real_pipeline
          asl config init --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --force
          sed -i -E 's/^workers[[:space:]]*=[[:space:]]*[0-9]+/workers = 1/' "$CFG"
          asl config validate --config "$CFG"
      - name: Historical ST and suspension bounded slice
        timeout-minutes: 325
        continue-on-error: true
        run: asl backfill trading_status --start 2008-01-01 --end 2026-08-27 --config "$CFG"
      - name: Trading-status audit snapshot
        if: always()
        run: asl status --datasets --config "$CFG" || true
      - name: Upload trading-status checkpoint even if incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-cont-stage2c-trading-status
          path: real_pipeline/
          retention-days: 3
          compression-level: 1

  stage3-features-audit:
    needs: stage2c-trading-status
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - uses: actions/download-artifact@v4
        with:
          name: rescue-cont-stage2c-trading-status
          path: real_pipeline
      - name: Build PIT overrides
        continue-on-error: true
        run: python scripts/build_conservative_overrides.py --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake"
      - name: Build benchmark and exact labels
        run: python scripts/build_real_market_layer.py --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake"
      - name: Build F01-F55 panel
        run: python scripts/build_real_factor_panel.py --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake"
      - name: Strict H1 audit
        continue-on-error: true
        run: python scripts/h1_real_data_audit.py --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" --reports "$GITHUB_WORKSPACE/real_pipeline/reports"
      - name: Immutable SHA256 manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('real_pipeline/ashare-lake'); rows=[]
          for p in sorted(root.rglob('*.parquet')):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              rows.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          out=Path('real_pipeline/reports/dataset_manifest.json'); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'files':rows,'file_count':len(rows),'total_bytes':sum(x['bytes'] for x in rows)},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload Stage 3 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-cont-stage3-features-audit
          path: real_pipeline/
          retention-days: 7
          compression-level: 2

  stage4-calibration-production:
    needs: stage3-features-audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-full.txt
      - uses: actions/download-artifact@v4
        with:
          name: rescue-cont-stage3-features-audit
          path: real_pipeline
      - name: Purged Walk-Forward calibration
        continue-on-error: true
        run: python scripts/run_real_calibration.py --factor-panel "$GITHUB_WORKSPACE/real_pipeline/ashare-lake/openpit_features/factor_panel_wide.parquet" --out "$GITHUB_WORKSPACE/real_pipeline/calibration" --cost-bps 20
      - name: Apply H1 two-key Production lock
        if: always()
        continue-on-error: true
        run: python scripts/finalize_production_pack.py --calibration-pack "$GITHUB_WORKSPACE/real_pipeline/calibration/production_parameter_pack.json" --h1-audit "$GITHUB_WORKSPACE/real_pipeline/reports/h1_real_data_audit.json" --manifest "$GITHUB_WORKSPACE/real_pipeline/reports/dataset_manifest.json" --out "$GITHUB_WORKSPACE/real_pipeline/calibration/FINAL_Production_Parameter_Pack.json"
      - name: Final status
        if: always()
        run: |
          cat real_pipeline/reports/h1_real_data_audit.json 2>/dev/null || true
          cat real_pipeline/calibration/calibration_summary.json 2>/dev/null || true
          cat real_pipeline/calibration/FINAL_Production_Parameter_Pack.json 2>/dev/null || true
      - name: Upload final Production outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-cont-final-openpit-production-pack
          path: |
            real_pipeline/reports/
            real_pipeline/ashare-lake/openpit_overrides/
            real_pipeline/ashare-lake/openpit_features/
            real_pipeline/calibration/
          retention-days: 14
          compression-level: 6
