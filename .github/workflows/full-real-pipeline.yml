name: Full Real Open-PIT Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-real-pipeline.yml'
      - 'scripts/full_real_bootstrap.py'
      - 'scripts/build_conservative_overrides.py'
      - 'scripts/build_real_market_layer.py'
      - 'scripts/build_real_factor_panel.py'
      - 'scripts/h1_real_data_audit.py'
      - 'scripts/run_real_calibration.py'
      - 'scripts/finalize_production_pack.py'
      - 'scripts/set_production_history_window.py'
      - 'requirements-full.txt'

permissions:
  contents: read

concurrency:
  group: full-real-openpit-pipeline
  cancel-in-progress: true

jobs:
  real-data-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned real-data runtime
        run: pip install -r requirements-full.txt

      - name: Set frozen Production history window 2008-2026
        run: |
          python scripts/set_production_history_window.py --start 2008-01-01

      - name: Runtime smoke
        run: |
          python --version
          asl --version
          asl catalog || true

      - name: Build 2008-2026 real A-share data lake
        id: bootstrap
        run: |
          python scripts/full_real_bootstrap.py \
            --workspace "$GITHUB_WORKSPACE/real_pipeline" \
            --profile full

      - name: Backfill historical ST/suspension status
        if: always()
        continue-on-error: true
        run: |
          CFG="$GITHUB_WORKSPACE/real_pipeline/configs/ashare-lake.toml"
          asl backfill trading_status --start 2008-01-01 --end 2026-08-27 --config "$CFG"

      - name: Build conservative timestamp overrides and quarantine queues
        if: always()
        continue-on-error: true
        run: |
          python scripts/build_conservative_overrides.py \
            --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake"

      - name: Build PIT total-return benchmarks and 20/60/120 exact-session labels
        if: always()
        continue-on-error: true
        run: |
          python scripts/build_real_market_layer.py \
            --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake"

      - name: Build real F01-F55 panel with Missing preserved
        if: always()
        continue-on-error: true
        run: |
          python scripts/build_real_factor_panel.py \
            --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake"

      - name: Run strict H1 real-data audit after BF3 artifacts exist
        id: h1audit
        if: always()
        continue-on-error: true
        run: |
          python scripts/h1_real_data_audit.py \
            --data-root "$GITHUB_WORKSPACE/real_pipeline/ashare-lake" \
            --reports "$GITHUB_WORKSPACE/real_pipeline/reports"

      - name: Create immutable dataset manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('real_pipeline/ashare-lake')
          rows=[]
          for p in sorted(root.rglob('*.parquet')):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''):
                      h.update(c)
              rows.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          out=Path('real_pipeline/reports/dataset_manifest.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({'files':rows,'file_count':len(rows),'total_bytes':sum(x['bytes'] for x in rows)},ensure_ascii=False,indent=2),encoding='utf-8')
          print(out.read_text())
          PY

      - name: Run purged walk-forward real calibration
        if: always()
        continue-on-error: true
        run: |
          python scripts/run_real_calibration.py \
            --factor-panel "$GITHUB_WORKSPACE/real_pipeline/ashare-lake/openpit_features/factor_panel_wide.parquet" \
            --out "$GITHUB_WORKSPACE/real_pipeline/calibration" \
            --cost-bps 20

      - name: Apply H1 two-key Production lock
        if: always()
        continue-on-error: true
        run: |
          python scripts/finalize_production_pack.py \
            --calibration-pack "$GITHUB_WORKSPACE/real_pipeline/calibration/production_parameter_pack.json" \
            --h1-audit "$GITHUB_WORKSPACE/real_pipeline/reports/h1_real_data_audit.json" \
            --manifest "$GITHUB_WORKSPACE/real_pipeline/reports/dataset_manifest.json" \
            --out "$GITHUB_WORKSPACE/real_pipeline/calibration/FINAL_Production_Parameter_Pack.json"

      - name: Show final status reports
        if: always()
        shell: bash
        run: |
          echo '=== Bootstrap ==='
          cat real_pipeline/reports/real_bootstrap_status.json 2>/dev/null || true
          echo '=== Market Layer ==='
          cat real_pipeline/ashare-lake/openpit_features/market_layer_summary.json 2>/dev/null || true
          echo '=== Factor Panel ==='
          cat real_pipeline/ashare-lake/openpit_features/factor_panel_summary.json 2>/dev/null || true
          echo '=== H1 Audit ==='
          cat real_pipeline/reports/h1_real_data_audit.json 2>/dev/null || true
          echo '=== Calibration ==='
          cat real_pipeline/calibration/calibration_summary.json 2>/dev/null || true
          echo '=== Final Production Pack ==='
          cat real_pipeline/calibration/FINAL_Production_Parameter_Pack.json 2>/dev/null || true

      - name: Upload audit feature calibration and Production pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-openpit-status-audit-calibration-2008-2026
          path: |
            real_pipeline/reports/
            real_pipeline/ashare-lake/openpit_overrides/
            real_pipeline/ashare-lake/openpit_features/
            real_pipeline/calibration/
            real_pipeline/logs/
          retention-days: 14
          compression-level: 6

      - name: Upload real data lake
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ashare-lake-2008-2026
          path: real_pipeline/ashare-lake/
          retention-days: 3
          compression-level: 1

      - name: Enforce bootstrap success only
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('real_pipeline/reports/real_bootstrap_status.json')
          if not p.exists():
              raise SystemExit('bootstrap status missing')
          j=json.loads(p.read_text(encoding='utf-8'))
          if not j.get('real_bootstrap_pass'):
              raise SystemExit('REAL_BOOTSTRAP did not pass; see artifact logs')
          print('REAL_BOOTSTRAP_PASS. Final Production status is governed separately by H1 + calibration gates.')
          PY
